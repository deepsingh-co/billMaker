<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050b18" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("barcode-suite-theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#020617" : "#f8fafc");
        } catch (error) {
          // Storage can be unavailable in private or embedded contexts.
        }
      })();
    </script>
    <meta
      name="description"
      content="Barcode Suite turns any camera into a checkout counter: scan products, generate invoices and watch revenue update live."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Barcode Suite | Barcode billing & retail analytics"
    />
    <meta
      property="og:description"
      content="Scan products, generate invoices and watch revenue update live from one fast retail workspace."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400..600&family=Fira+Sans:wght@400..700&family=Plus+Jakarta+Sans:wght@600..800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400..600&family=Fira+Sans:wght@400..700&family=Plus+Jakarta+Sans:wght@600..800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400..600&family=Fira+Sans:wght@400..700&family=Plus+Jakarta+Sans:wght@600..800&display=swap"
      />
    </noscript>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Barcode Suite | Barcode billing &amp; retail analytics</title>
  </head>
